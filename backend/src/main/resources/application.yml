server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_knowbot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

coze:
  api:
    base-url: https://api.coze.cn
    token: your_coze_api_token_here
    bot-id: your_bot_id_here

logging:
  level:
    com.aiknowbot: DEBUG
