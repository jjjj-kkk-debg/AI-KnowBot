server:
  port: ${PORT:8080}

spring:
  datasource:
    url: jdbc:h2:mem:ai_knowbot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

coze:
  api:
    base-url: https://api.coze.cn
    token: ${COZE_API_TOKEN}
    bot-id: ${COZE_BOT_ID}

logging:
  level:
    com.aiknowbot: DEBUG
