<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能问答 - AI KnowBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        #messages { scroll-behavior: smooth; }
        .message-enter { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { animation: typingBounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typingBounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
    <nav class="gradient-bg text-white shadow-lg px-4 py-3 flex items-center">
        <a href="/" class="mr-4 hover:opacity-80">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
        </a>
        <h1 class="text-xl font-bold">智能问答</h1>
    </nav>

    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

    <div class="border-t bg-white p-4">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input id="input" type="text" placeholder="输入您的问题..." class="flex-1 rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
            <button onclick="sendMessage()" class="gradient-bg text-white px-6 py-3 rounded-xl hover:opacity-90 transition font-medium">发送</button>
        </div>
    </div>

    <script>
        const conversationId = Date.now();
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = 'message-enter flex ' + (role === 'user' ? 'justify-end' : 'justify-start');
            div.innerHTML = '<div class="max-w-[70%] rounded-2xl px-4 py-3 ' +
                (role === 'user' ? 'gradient-bg text-white' : 'bg-white shadow-sm border border-gray-100 text-gray-800') +
                '">' + content + '</div>';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.id = 'typing';
            div.className = 'flex justify-start message-enter';
            div.innerHTML = '<div class="bg-white shadow-sm border border-gray-100 rounded-2xl px-4 py-3 flex space-x-1"><span class="typing-dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span><span class="typing-dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span><span class="typing-dot w-2 h-2 bg-gray-400 rounded-full inline-block"></span></div>';
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        async function pollResult(taskId) {
            const maxAttempts = 300;
            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const res = await fetch('/api/ai/result/' + taskId);
                    const data = await res.json();
                    if (data.code === 200) {
                        if (data.data.status === 'COMPLETED') {
                            hideTyping();
                            addMessage('assistant', data.data.content);
                            return;
                        }
                        if (data.data.status === 'FAILED') {
                            hideTyping();
                            addMessage('assistant', data.data.content || 'AI处理失败，请重试。');
                            return;
                        }
                    }
                } catch (e) {
                    // ignore polling errors
                }
                await new Promise(r => setTimeout(r, 2000));
            }
            hideTyping();
            addMessage('assistant', 'AI处理超时，请重试。');
        }

        async function sendMessage() {
            const input = document.getElementById('input');
            const content = input.value.trim();
            if (!content) return;
            input.value = '';
            addMessage('user', content);
            showTyping();

            try {
                const res = await fetch('/api/ai/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({userId, question: content})
                });
                const data = await res.json();
                if (data.code === 200) {
                    pollResult(data.data);
                } else {
                    hideTyping();
                    addMessage('assistant', '抱歉，服务暂不可用，请稍后重试。');
                }
            } catch (e) {
                hideTyping();
                addMessage('assistant', '网络连接失败，请检查网络后重试。');
            }
        }

        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        addMessage('assistant', '您好！我是 AI KnowBot 智能助手，有什么可以帮助您的吗？');
    </script>
</body>
</html>
