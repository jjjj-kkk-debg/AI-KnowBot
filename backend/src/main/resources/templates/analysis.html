<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据分析 - AI KnowBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg px-4 py-3 flex items-center">
        <a href="/" class="mr-4 hover:opacity-80"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
        <h1 class="text-xl font-bold">AI 数据分析</h1>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">数据内容</label>
                <textarea id="data" rows="5" placeholder="请输入要分析的数据（文本、数字、表格等）..." class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">分析类型</label>
                <select id="type" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="通用">通用分析</option>
                    <option value="趋势">趋势分析</option>
                    <option value="对比">对比分析</option>
                    <option value="统计">统计分析</option>
                    <option value="建议">建议分析</option>
                </select>
            </div>
            <button onclick="analyze()" class="gradient-bg text-white px-6 py-3 rounded-lg hover:opacity-90 transition font-medium">开始分析</button>
        </div>

        <div id="result" class="bg-white rounded-xl shadow-md p-6 hidden">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">分析结果</h3>
            <div id="content" class="text-gray-700 leading-relaxed"></div>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto"></div>
            <p class="text-gray-500 mt-4">AI 正在分析数据，请稍候...</p>
        </div>
    </main>

    <script>
        async function analyze() {
            const data = document.getElementById('data').value.trim();
            if (!data) { alert('请输入分析数据'); return; }
            const type = document.getElementById('type').value;
            document.getElementById('result').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await fetch('/api/ai/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({data, type, userId: 'user_' + Math.random().toString(36).substr(2, 9)})
                });
                const dataJson = await res.json();
                document.getElementById('loading').classList.add('hidden');
                if (dataJson.code === 200) {
                    document.getElementById('content').innerHTML = dataJson.data.replace(/\n/g, '<br>');
                    document.getElementById('result').classList.remove('hidden');
                } else {
                    alert('分析失败：' + dataJson.message);
                }
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
                alert('网络请求失败');
            }
        }
    </script>
</body>
</html>
