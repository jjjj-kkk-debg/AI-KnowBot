<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - AI KnowBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg px-4 py-3 flex items-center">
        <a href="/" class="mr-4 hover:opacity-80"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
        <h1 class="text-xl font-bold">知识库管理</h1>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">添加知识条目</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                <input id="kbTitle" type="text" placeholder="标题" class="rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
                <input id="kbCategory" type="text" placeholder="分类" class="rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
                <input id="kbSearch" type="text" placeholder="搜索知识库..." class="rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>
            <textarea id="kbContent" rows="3" placeholder="内容" class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 mb-4"></textarea>
            <div class="flex gap-3">
                <button onclick="addKnowledge()" class="gradient-bg text-white px-6 py-3 rounded-lg hover:opacity-90 transition font-medium">添加</button>
                <button onclick="searchKnowledge()" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition font-medium">搜索</button>
                <button onclick="loadKnowledge()" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg hover:bg-gray-300 transition font-medium">全部</button>
            </div>
        </div>

        <div id="kbList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <script>
        async function loadKnowledge() {
            try {
                const res = await fetch('/api/knowledge');
                const data = await res.json();
                renderList(data.data);
            } catch (e) { console.error(e); }
        }

        async function searchKnowledge() {
            const keyword = document.getElementById('kbSearch').value.trim();
            if (!keyword) { loadKnowledge(); return; }
            try {
                const res = await fetch('/api/knowledge/search?keyword=' + encodeURIComponent(keyword));
                const data = await res.json();
                renderList(data.data);
            } catch (e) { console.error(e); }
        }

        async function addKnowledge() {
            const title = document.getElementById('kbTitle').value.trim();
            const content = document.getElementById('kbContent').value.trim();
            const category = document.getElementById('kbCategory').value.trim();
            if (!title || !content) { alert('标题和内容不能为空'); return; }
            try {
                await fetch('/api/knowledge', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({title, content, category})
                });
                document.getElementById('kbTitle').value = '';
                document.getElementById('kbContent').value = '';
                document.getElementById('kbCategory').value = '';
                loadKnowledge();
            } catch (e) { console.error(e); }
        }

        async function deleteKnowledge(id) {
            if (!confirm('确定删除？')) return;
            try {
                await fetch('/api/knowledge/' + id, {method: 'DELETE'});
                loadKnowledge();
            } catch (e) { console.error(e); }
        }

        function renderList(items) {
            const container = document.getElementById('kbList');
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-500 py-8">暂无知识条目</div>';
                return;
            }
            container.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow-md p-4 border border-gray-100">
                    <div class="flex items-start justify-between mb-2">
                        <h4 class="font-semibold text-gray-800">${item.title}</h4>
                        <span class="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded">${item.category || '未分类'}</span>
                    </div>
                    <p class="text-gray-600 text-sm mb-3 line-clamp-3">${item.content}</p>
                    <div class="flex justify-between items-center text-xs text-gray-400">
                        <span>${item.createdAt ? new Date(item.createdAt).toLocaleDateString() : ''}</span>
                        <button onclick="deleteKnowledge(${item.id})" class="text-red-500 hover:text-red-700">删除</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('kbSearch').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchKnowledge();
        });

        loadKnowledge();
    </script>
</body>
</html>
