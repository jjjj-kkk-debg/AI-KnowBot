<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像生成 - AI KnowBot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>.gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }</style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="gradient-bg text-white shadow-lg px-4 py-3 flex items-center">
        <a href="/" class="mr-4 hover:opacity-80"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg></a>
        <h1 class="text-xl font-bold">AI 图像生成</h1>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-xl shadow-md p-6 mb-6">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">图片描述</label>
                <textarea id="prompt" rows="3" placeholder="请描述您想要的图片内容..." class="w-full rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500"></textarea>
            </div>
            <button onclick="generateImage()" class="gradient-bg text-white px-6 py-3 rounded-lg hover:opacity-90 transition font-medium">生成图片</button>
        </div>

        <div id="result" class="bg-white rounded-xl shadow-md p-6 hidden">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">生成结果</h3>
            <div id="content" class="text-gray-700 leading-relaxed"></div>
        </div>

        <div id="loading" class="hidden text-center py-8">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto"></div>
            <p class="text-gray-500 mt-4">AI 正在生成图片，请稍候...</p>
        </div>
    </main>

    <script>
        async function pollResult(taskId) {
            const maxAttempts = 300;
            for (let i = 0; i < maxAttempts; i++) {
                try {
                    const res = await fetch('/api/ai/result/' + taskId);
                    const data = await res.json();
                    if (data.code === 200) {
                        if (data.data.status === 'COMPLETED') {
                            document.getElementById('loading').classList.add('hidden');
                            document.getElementById('content').innerHTML = data.data.content.replace(/\n/g, '<br>');
                            document.getElementById('result').classList.remove('hidden');
                            return;
                        }
                        if (data.data.status === 'FAILED') {
                            document.getElementById('loading').classList.add('hidden');
                            alert(data.data.content || 'AI处理失败，请重试。');
                            return;
                        }
                    }
                } catch (e) { }
                await new Promise(r => setTimeout(r, 2000));
            }
            document.getElementById('loading').classList.add('hidden');
            alert('AI处理超时，请重试。');
        }

        async function generateImage() {
            const prompt = document.getElementById('prompt').value.trim();
            if (!prompt) { alert('请输入图片描述'); return; }
            document.getElementById('result').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await fetch('/api/ai/generate-image', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt, userId: 'user_' + Math.random().toString(36).substr(2, 9)})
                });
                const data = await res.json();
                if (data.code === 200) {
                    pollResult(data.data);
                } else {
                    document.getElementById('loading').classList.add('hidden');
                    alert('生成失败：' + data.message);
                }
            } catch (e) {
                document.getElementById('loading').classList.add('hidden');
                alert('网络请求失败');
            }
        }
    </script>
</body>
</html>
